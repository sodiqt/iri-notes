name: iri-recorder

on:
  schedule:
    - cron: "35 8 * * 1-4"
  workflow_dispatch:
    inputs:
      test:
        description: "Type test here for a 60-second test run"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg yt-dlp
          pip install -q faster-whisper
      - name: Record and transcribe today's IRI
        run: bash .github/workflows/iri_day.sh "${{ inputs.test }}"
      - name: Publish transcripts into the repo
        run: |
          git config user.name "iri-bot"
          git config user.email "iri-bot@users.noreply.github.com"
          mkdir -p transcripts
          git add -A transcripts/
          git diff --cached --quiet || { git commit -m "IRI transcripts $(date -u +%F)"; git push; }
